version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysongspace_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_DOCKER}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - mynetwork

  redis:
    image: redis:alpine
    container_name: mysongspace_redis
    networks:
      - mynetwork

  app:
    build: .
    image: simhyeonseok/mysongspace_myapp:latest
    container_name: myapp
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - db
      - redis
    entrypoint: ["sh", "-c", "sleep 5 && java -jar app.jar"]
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
