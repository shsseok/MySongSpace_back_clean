name: Deploy to EC2 SERVER_MYSONGSPACE

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug secrets (masked)
        run: |
         if [ -z "${DOCKERHUB_USERNAME}" ]; then echo "DOCKERHUB_USERNAME is empty" && exit 1; fi
         if [ -z "${DOCKERHUB_TOKEN}" ]; then echo "DOCKERHUB_TOKEN is empty" && exit 1; fi
          echo "USERNAME length: ${#DOCKERHUB_USERNAME}"
          echo "TOKEN length: ${#DOCKERHUB_TOKEN}"
        env:
         DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
         DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            simhyeonseok/mysongspace_myapp:latest
            simhyeonseok/mysongspace_myapp:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH EC2 and deploy with docker compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            echo "===== DEPLOY START ====="

            cd mysongspace

            docker --version
            docker compose version

            echo "===== Docker Hub Login (for private future-proof) ====="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "===== Pull & Up ====="
            docker compose pull
            docker compose up -d --force-recreate

            echo "===== Status ====="
            docker ps -a
            echo "===== DEPLOY FINISHED ====="
